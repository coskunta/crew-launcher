plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
version = '0.2.0-alpha.1'
group = 'de.crew'
base { archivesName = 'crew-client' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:26.3'
 implementation 'net.fabricmc:fabric-loader:0.19.5'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.163.0+26.3'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }

tasks.register('protocolCheck', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'de.crew.ProtocolTest'
}
check.dependsOn protocolCheck

tasks.register('featuresCheck', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'de.crew.FeaturesTest'
 systemProperty 'java.awt.headless', 'true'
}
check.dependsOn featuresCheck
